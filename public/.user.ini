; Applies when PHP runs as CGI/FastCGI and the host permits per-directory overrides.
; Keep this file in the actual web document root (Laravel public/).
; Laravel Campaign/Media controllers enforce a 100 MB per-video validation limit.
upload_max_filesize = 128M
post_max_size = 160M
max_file_uploads = 20
max_input_time = 300
max_execution_time = 300
memory_limit = 512M
